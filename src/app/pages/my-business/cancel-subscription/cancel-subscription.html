<br>
<button 
  (click)="openModal()" 
  class="inline-flex items-center gap-2 bg-[#b91c1c] hover:bg-[#991b1b] text-white px-4 py-2 rounded-md font-medium transition-colors shadow-sm text-sm">
  
  Cancelar Suscripción
</button>

<div 
  *ngIf="isOpen" 
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity">
  
  <div class="bg-white rounded-xl shadow-xl w-full max-w-[450px] mx-4 overflow-hidden border border-slate-100">
    
    <div class="flex items-center justify-between px-6 pt-6 pb-4">
      <h3 class="text-lg font-semibold text-slate-800">Confirmación de cancelación de servicio</h3>
      <button (click)="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="flex items-start gap-4 px-6 py-4">
      <div class="flex-shrink-0 text-slate-700 mt-1">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <div class="text-sm text-slate-600 pt-2">
        ¿Estás seguro de que quieres proceder?
        Perderas el acceso a tu panel de control, ya no podrás gestionar tu inventario ni tus ventas, y tu negocio quedará inactivo.
      </div>
    </div>

    <div class="flex justify-end items-center gap-2 px-6 pb-6 pt-4">
      <button 
        (click)="closeModal()" 
        class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 rounded-md transition-colors border border-transparent">
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
        No
      </button>

      <button 
        (click)="onConfirm()" 
        class="inline-flex items-center gap-1.5 bg-[#10b981] hover:bg-[#059669] text-white px-4 py-2 text-sm font-medium rounded-md transition-colors shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Sí
      </button>
    </div>

  </div>
</div>
